[project]
name = "mdcomputers-product-scraper"
version = "1.0.0"
description = "A production-grade web scraper for MDComputers.in product listings"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
